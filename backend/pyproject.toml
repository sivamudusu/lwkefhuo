[project]
name = "reint"
version = "0.1.0"
description = "Wind forecast decision desk API for the GB day-ahead market"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.117.0",
    "httpx>=0.28.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "ty>=0.0.1a0",
]

[build-system]
requires = ["uv_build>=0.11.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "1 week"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "SIM",
    "TCH",
    "RUF",
]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --cov=reint --cov-report=term-missing"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
possibly-unresolved-reference = "error"
unused-ignore-comment = "warn"
