services:
  api:
    build:
      context: ./backend
      args:
        VERSION: ${VERSION:-dev}
    environment:
      APP_VERSION: ${VERSION:-dev}
      SNAPSHOT_PATH: /app/data/snapshot.sqlite
      CORS_ORIGINS: ""
    expose:
      - "8000"
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        BACKEND_ORIGIN: http://api:8000
    environment:
      BACKEND_ORIGIN: http://api:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
